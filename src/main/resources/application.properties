spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/garage_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_CHANGE_ME_1234567890}
app.jwt.expirationMinutes=${JWT_EXPIRATION_MINUTES:240}

app.uploads.dir=${UPLOADS_DIR:./uploads}

app.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://192.168.100.5:5173,http://192.168.100.16:5173}

# Return useful validation reasons to the frontend instead of only the HTTP status.
server.error.include-message=always
