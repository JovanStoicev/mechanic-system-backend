server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/garage_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_CHANGE_ME"
    expirationMinutes: 240
  uploads:
    dir: "./uploads"
  cors:
    allowedOrigins:
      - "http://localhost:5173"
